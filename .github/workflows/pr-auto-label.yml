# .github/workflows/auto-label.yml
name: Auto Label

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Label by PR title and type checkboxes
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const body  = context.payload.pull_request.body || '';

            // Parse only CHECKED boxes from the PR Type section
            // Matches "- [x] Issue (bug fix)" but not "- [ ] Issue (bug fix)"
            const checkedBoxes = [...body.matchAll(/- \[x\] (.+)/gi)]
              .map(m => m[1].toLowerCase());

            const toAdd = [];

            // Check title for conventional commit prefixes
            if (/^fix(\(.+\))?:/.test(title) || checkedBoxes.some(b => b.includes('issue') || b.includes('bug'))) {
              toAdd.push('bug');
            }
            if (/^feat(\(.+\))?:/.test(title) || checkedBoxes.some(b => b.includes('new feature'))) {
              toAdd.push('enhancement');
            }
            if (/^docs(\(.+\))?:/.test(title) || checkedBoxes.some(b => b.includes('documentation'))) {
              toAdd.push('documentation');
            }

            console.log('Checked boxes found:', checkedBoxes);
            console.log('Labels to add:', toAdd);

            if (toAdd.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: toAdd,
            });
